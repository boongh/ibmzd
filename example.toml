[server]
host="0.0.0.0"
port=8080

[database]
path="./storage.db"

[log]
level="INFO"

[auth]
token_ttl_hours=168

[ner]
# LiquidAI/LFM2.5-Encoder-350M-PII-Detector (pinned revision, see src/ner.py); needs torch + transformers,
# and torch-nnpa for mode="hybrid". Disabled: sessions whose ruleset has an NER rule refuse to chat.
enabled=false
cache_dir="~/lfm25-pii-linuxone/hf-cache"   # Hugging Face cache that already contains the model
mode="cpu"                                  # "hybrid": NNPA (IBM z16 / LinuxONE 4) with ShortConv on CPU
local_files_only=true                       # never download at startup
